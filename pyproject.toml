[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reaper-assets"
version = "1.0.0"
description = "Emit canonical, valid REAPER .rpp session templates programmatically (tracks, buses, sends, folders, markers, stock FX) and package them with docs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Scott Mills", email = "scottmills306@gmail.com" }]
keywords = ["reaper", "rpp", "audio", "daw", "session-template", "reascript"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[dependency-groups]
dev = ["pytest>=7.0"]

[project.scripts]
reaper-assets = "reaper_assets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
